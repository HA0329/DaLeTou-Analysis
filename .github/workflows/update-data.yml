name: Update Lottery Data

# 定时从体彩官网拉取最新开奖并更新 data.js，为 GitHub Pages 提供持续同步的静态数据。
#
# 时区换算：GitHub Actions 的 cron 一律按 UTC 解释。
#   北京时间（UTC+8）周一/周三/周六 21:25 开奖，对应 UTC 同日 13:25。
#   下表两个时间点都落在「开奖之后」：
#     北京 21:45 = UTC 13:45（开奖后 20 分钟，官方数据通常已发布）
#     北京 23:00 = UTC 15:00（兜底：官网发布延迟、或上一次因队列拥塞未跑时补上）
# 注：Actions 的 schedule 属于「尽力而为」，高负载时可能延迟甚至跳过，
#     因此同一开奖日安排两次，并支持手动 workflow_dispatch 补数。
on:
  schedule:
    - cron: '45 13 * * 1,3,6'   # 北京 周一/三/六 21:45（开奖后 20 分钟）
    - cron: '0 15 * * 1,3,6'    # 北京 周一/三/六 23:00（兜底补数）
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

# 防止两次定时任务重叠导致 push 冲突
concurrency:
  group: update-lottery-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node update.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.js; then
            echo "data.js 无变化，无需提交"
            exit 0
          fi
          git add data.js
          git commit -m "chore: auto-update lottery data via GitHub Actions"
          # push 可能因远端有新提交而被拒，重试前先 rebase 到最新
          for i in 1 2 3; do
            if git push; then
              echo "data.js 已更新并推送"
              exit 0
            fi
            echo "push 失败，第 $i 次重试前先同步远端…"
            git pull --rebase --autostash
            sleep 5
          done
          echo "推送多次失败，请检查仓库权限" >&2
          exit 1
