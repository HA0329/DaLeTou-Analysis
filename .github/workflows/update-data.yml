name: Update Lottery Data

# 定时从体彩官网拉取最新开奖并更新 data.js，确保 GitHub Pages 上的数据始终最新。
# 大乐透开奖时间：每周一、三、六 21:25（北京时间），Action 在开奖后 1 小时运行。
on:
  schedule:
    # 北京时间周二、四、日 06:00 = UTC 周一、三、六 22:00（开奖后约 45 分钟）
    - cron: '0 22 * * 1,3,6'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node update.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.js; then
            echo "data.js 无变化，无需提交"
          else
            git add data.js
            git commit -m "chore: auto-update lottery data via GitHub Actions"
            git push
            echo "data.js 已更新并推送"
          fi
